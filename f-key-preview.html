<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fキー案内・10案プレビュー</title><style>
*{box-sizing:border-box}body{margin:0;padding:22px;background:#f6f8fb;color:#20394c;font:14px system-ui}h1{font-size:23px;margin:0 0 7px}p{margin:0 0 20px;color:#62798a}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid #d9e3ea;border-radius:14px;overflow:hidden}.card h2{font-size:14px;margin:0;padding:13px 12px}.scene{height:247px;position:relative;overflow:hidden;background:#dce7c4}.scene:before{content:'';position:absolute;width:110%;height:35px;top:70px;left:5px;background:#fff;border:9px solid #529bec;transform:rotate(-32deg);border-radius:35px}.scene:after{content:'288.0 KP';position:absolute;top:20px;right:12px;background:#fff;border:1px solid #4794db;color:#4794db;padding:4px 8px;border-radius:20px;font:bold 10px system-ui}.river{position:absolute;background:#b7dcef;width:30px;height:400px;transform:rotate(18deg);right:22px;top:-70px}.stack{position:absolute;left:12px;top:12px;z-index:2;display:flex;flex-direction:column;gap:7px}.zoom{background:#fff;border:1px solid #cfdae3;border-radius:8px;box-shadow:0 2px 8px #22435d20;width:44px;text-align:center;font:bold 26px/39px system-ui}.zoom div+div{border-top:1px solid #e1e6eb}.recenter,.full{background:#fff;border:1px solid #cfdae3;box-shadow:0 2px 8px #22435d20;border-radius:10px;width:48px;height:48px;display:flex;align-items:center;justify-content:center}.recenter{color:#e53e4b;font-size:28px}.full{color:#466477;flex-direction:column;gap:1px}.full svg{width:24px;height:24px}.full small{font-size:9px;font-weight:800}.row{display:flex;align-items:center;gap:9px}.hint{position:relative;font:bold 12px system-ui;color:#607787;pointer-events:none;user-select:none;display:inline-flex;align-items:center;justify-content:center;width:24px;height:25px}.caption{padding:11px 12px;color:#62798a;font-size:11px;line-height:1.55;min-height:53px}.v1{animation:breath 5s ease-in-out infinite}.v2{color:#bd7932;background:#fff5e6;border:1px solid #f0d5b0;border-radius:6px;animation:warm 6s infinite}.v3{border:1px solid #c8d3dd;border-bottom-width:3px;border-radius:5px;background:#fff;animation:key 6s infinite}.v4{border:1px solid #c8d3dd;border-radius:50%}.v4:after{content:'';position:absolute;inset:-2px;border:1px solid #8da9ba;border-radius:50%;animation:ring 7s infinite}.v5{background:#edf3f6;border-radius:6px;overflow:hidden}.v5:after{content:'';position:absolute;inset:-10px;background:linear-gradient(100deg,transparent 40%,#ffffffa8 50%,transparent 60%);animation:shine 7s infinite}.v6{animation:float 6s infinite}.v7{width:21px}.v7:after{content:'';height:2px;border-radius:2px;position:absolute;bottom:1px;left:3px;right:3px;background:#9cafbd;animation:breath 5s infinite}.v8{width:31px;gap:5px}.v8:before{content:'';width:4px;height:4px;border-radius:50%;background:#daaa65;animation:breath 5s infinite}.v9{width:32px;height:23px;background:#ffffffa8;border:1px solid #c9d6df;border-radius:20px;animation:pill 6s infinite}.v10:before,.v10:after{content:'';position:absolute;width:5px;height:6px;border-color:#91a9b8;border-style:solid;animation:breath 5s infinite}.v10:before{left:0;top:1px;border-width:1px 0 0 1px}.v10:after{right:0;bottom:1px;border-width:0 1px 1px 0}
@keyframes breath{0%,100%{opacity:.66}50%{opacity:1}}@keyframes warm{0%,100%{box-shadow:0 0 0 #ddb27500}50%{box-shadow:0 0 7px #ddb27540}}@keyframes key{0%,85%,100%{transform:translateY(0)}90%{transform:translateY(1px)}}@keyframes ring{0%,65%,100%{opacity:0;transform:scale(1)}75%{opacity:.35}90%{opacity:0;transform:scale(1.5)}}@keyframes shine{0%,70%{transform:translateX(-40px)}90%,100%{transform:translateX(40px)}}@keyframes float{0%,80%,100%{transform:translateY(0)}90%{transform:translateY(-2px)}}@keyframes pill{0%,100%{background:#ffffffa8}50%{background:#fff}}@media(max-width:1050px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:650px){body{padding:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.scene{height:247px}h1{font-size:20px}}@media(prefers-reduced-motion:reduce){.hint,.hint:before,.hint:after{animation:none!important}}
</style><h1>全画面ボタンの右に「F」・10案</h1><p>クリック判定なし。Fで全画面を開く／閉じる案内。エフェクトは5〜7秒周期で控えめに。①と③が特に見やすいと思うよ。</p><main class="grid" id="grid"></main><script>
const designs=[['文字のフェード','飾りを足さず、文字がゆっくり濃淡変化。'],['淡いオレンジ','薄いオレンジの枠が、やさしく発光。'],['小さなキーボード','キーの形。たまに1pxだけ押し込む動き。'],['円と小さな波','小さな丸の外に、薄い波が1回出る。'],['一筋の光','薄い背景に、時々細い光が横切る。'],['ほんの少し浮く','文字が時々2pxだけ上に浮く。'],['下線アクセント','文字の下の細い線がゆっくり明滅。'],['小さな点付き','小さなオレンジの点が、ゆっくり明滅。'],['半透明ピル','丸い薄背景が、ゆっくり白くなる。'],['角のアクセント','小さな対角の枠が、ゆっくり明滅。']];
document.getElementById('grid').innerHTML=designs.map(([name,desc],i)=>`<section class="card"><h2>${i+1}. ${name}</h2><div class="scene"><i class="river"></i><div class="stack"><div class="zoom"><div>+</div><div>−</div></div><div class="recenter">◎</div><div class="row"><div class="full"><svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><small>全画面</small></div><span class="hint v${i+1}" aria-hidden="true">F</span></div></div></div><div class="caption">${desc}</div></section>`).join('');
</script></html>
