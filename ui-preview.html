<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KPMAP 全体デザイン20案</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f1f4f8;color:#21384c}main{max-width:1500px;margin:auto;padding:22px 16px}h1{margin:0 0 8px;font-size:24px}p{margin:0 0 16px;font-size:13px;line-height:1.7}.choices{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:16px}.choices button{font:inherit;font-size:12px;display:flex;align-items:center;gap:8px;text-align:left;border:1px solid var(--border);border-radius:10px;background:white;padding:10px;cursor:pointer;min-width:0}.choices button[aria-pressed=true]{outline:2px solid #e68032}.choices b{color:#ba6628}.swatch{display:flex;flex:none;width:32px;height:24px;border:1px solid var(--border);border-radius:5px;background:var(--bg);overflow:hidden}.swatch i{width:50%;background:var(--panel)}.swatch i+i{background:var(--bg)}.bar{display:flex;align-items:center;flex-wrap:wrap;gap:12px;background:white;border:1px solid #d5e0ea;border-radius:10px;padding:12px;margin-bottom:12px;font-size:13px}.bar strong{margin-right:auto}.bar a{color:#176ec0}.bar button{border:1px solid #ccd8e4;background:#f7f9fc;color:#294b65;border-radius:6px;padding:7px 10px;cursor:pointer}.frame-wrap{margin:auto;background:white;border:1px solid #d5e0ea;border-radius:12px;overflow:hidden;transition:max-width .2s}.frame-wrap.mobile{max-width:390px}iframe{display:block;width:100%;height:850px;border:0;background:#fff}.note{margin-top:12px;color:#64788a}@media(max-width:800px){.choices{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:500px){main{padding:18px 10px}.choices{grid-template-columns:repeat(2,minmax(0,1fr))}.choices button{font-size:11px;padding:8px}h1{font-size:21px}iframe{height:780px}}</style><main><h1>KPMAP 全体デザイン・20種類</h1><p>番号を押すと、下の実際のKPMAPが切り替わります。ロゴ周り・操作欄・交通情報だけを整え、地図内部のデザインはそのままです。</p><div class="choices"><button data-n="1" style="--bg:#f2f7fc;--panel:#e8f2fc;--border:#bfd7ef" aria-pressed="true"><span class="swatch"><i></i><i></i></span><span><b>01</b> アイスブルー</span></button><button data-n="2" style="--bg:#faf8f5;--panel:#fff1e5;--border:#ead8c4" aria-pressed="false"><span class="swatch"><i></i><i></i></span><span><b>02</b> ウォームホワイト</span></button><button data-n="3" style="--bg:#f2f8f6;--panel:#e5f4ec;--border:#bcdccc" aria-pressed="false"><span class="swatch"><i></i><i></i></span><span><b>03</b> ミント</span></button><button data-n="4" style="--bg:#f6f4fb;--panel:#eeebfa;--border:#d2c9ea" aria-pressed="false"><span class="swatch"><i></i><i></i></span><span><b>04</b> ラベンダー</span></button><button data-n="5" style="--bg:#f1f4f7;--panel:#e7edf3;--border:#c6d1dc" aria-pressed="false"><span class="swatch"><i></i><i></i></span><span><b>05</b> スレート</span></button><button data-n="6" style="--bg:#fff7f4;--panel:#ffece4;--border:#efccbc" aria-pressed="false"><span class="swatch"><i></i><i></i></span><span><b>06</b> ピーチ</span></button><button data-n="7" style="--bg:#f2f8fb;--panel:#e7f2fc;--border:#c0d7e4" aria-pressed="false"><span class="swatch"><i></i><i></i></span><span><b>07</b> スカイ＆ミント</span></button><button data-n="8" style="--bg:#f8f6f0;--panel:#f1eddf;--border:#ded5bd" aria-pressed="false"><span class="swatch"><i></i><i></i></span><span><b>08</b> サンド</span></button><button data-n="9" style="--bg:#f1f4f8;--panel:#ffffff;--border:#d8e1eb" aria-pressed="false"><span class="swatch"><i></i><i></i></span><span><b>09</b> ホワイトカード</span></button><button data-n="10" style="--bg:#faf4f6;--panel:#f9eaf0;--border:#e8ccd7" aria-pressed="false"><span class="swatch"><i></i><i></i></span><span><b>10</b> ソフトローズ</span></button><button data-n="11" style="--bg:#f1f8fa;--panel:#e5f3f6;--border:#b8dbe3" aria-pressed="false"><span class="swatch"><i></i><i></i></span><span><b>11</b> クールシアン</span></button><button data-n="12" style="--bg:#f5f4f2;--panel:#ebe8e4;--border:#d5cfc7" aria-pressed="false"><span class="swatch"><i></i><i></i></span><span><b>12</b> グレージュ</span></button><button data-n="13" style="--bg:#f8fbfe;--panel:#eef5fe;--border:#a7c8ed" aria-pressed="false"><span class="swatch"><i></i><i></i></span><span><b>13</b> ブルーライン</span></button><button data-n="14" style="--bg:#fffaf6;--panel:#fff0e1;--border:#ebc69f" aria-pressed="false"><span class="swatch"><i></i><i></i></span><span><b>14</b> オレンジライン</span></button><button data-n="15" style="--bg:#f6fbf8;--panel:#eaf5ed;--border:#b2d6bc" aria-pressed="false"><span class="swatch"><i></i><i></i></span><span><b>15</b> グリーンライン</span></button><button data-n="16" style="--bg:#f8f9fb;--panel:#f6f4fa;--border:#dedee9" aria-pressed="false"><span class="swatch"><i></i><i></i></span><span><b>16</b> パール</span></button><button data-n="17" style="--bg:#fff8f5;--panel:#ffefe7;--border:#efc9b8" aria-pressed="false"><span class="swatch"><i></i><i></i></span><span><b>17</b> サンセットライト</span></button><button data-n="18" style="--bg:#eef3f8;--panel:#e5edf7;--border:#aebed3" aria-pressed="false"><span class="swatch"><i></i><i></i></span><span><b>18</b> ネイビーフレーム</span></button><button data-n="19" style="--bg:#ffffff;--panel:#f5f7f9;--border:#e1e6eb" aria-pressed="false"><span class="swatch"><i></i><i></i></span><span><b>19</b> フラットミニマル</span></button><button data-n="20" style="--bg:#f7f5f0;--panel:#fff7e8;--border:#ddd0b3" aria-pressed="false"><span class="swatch"><i></i><i></i></span><span><b>20</b> プレミアムクリーム</span></button></div><div class="bar"><strong id="selected">① アイスブルー</strong><button id="desktop">PC幅</button><button id="mobile">スマホ幅</button><a id="open" href="/?ui-preview=1" target="_blank" rel="noopener">大きく開く ↗</a></div><div class="frame-wrap" id="wrap"><iframe id="preview" title="選択したKPMAPの全体プレビュー" src="/?ui-preview=1"></iframe></div><p class="note">好きな番号をちゃっぴーに伝えてね。本番のデザインは、選んだあとに反映します。プレビュー内もスクロールできます。</p></main><script>const names=["アイスブルー","ウォームホワイト","ミント","ラベンダー","スレート","ピーチ","スカイ＆ミント","サンド","ホワイトカード","ソフトローズ","クールシアン","グレージュ","ブルーライン","オレンジライン","グリーンライン","パール","サンセットライト","ネイビーフレーム","フラットミニマル","プレミアムクリーム"];document.querySelectorAll(".choices button").forEach(b=>b.addEventListener("click",()=>{const n=Number(b.dataset.n);document.querySelectorAll(".choices button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));document.querySelector("#selected").textContent=n+"番 "+names[n-1];document.querySelector("#preview").src="/?ui-preview="+n;document.querySelector("#open").href="/?ui-preview="+n}));document.querySelector("#mobile").onclick=()=>document.querySelector("#wrap").classList.add("mobile");document.querySelector("#desktop").onclick=()=>document.querySelector("#wrap").classList.remove("mobile");</script></html>
