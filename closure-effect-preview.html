<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KPMAP 警告エフェクト10案</title><link rel="stylesheet" href="/closure-effects.css">
<style>body{font:14px system-ui;color:#28465c;background:#f6f8fb;margin:0;padding:18px}main{max-width:900px;margin:auto}h1{font-size:20px}p{color:#647b8d;font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:white;border:1px solid #d7e1e9;border-radius:10px;overflow:hidden}.card h2{font-size:13px;margin:12px}.scene{height:128px;display:flex;align-items:center;justify-content:center;gap:55px;background:#eef3e8}.traffic-pin{position:relative;display:flex;align-items:center;justify-content:center;border-radius:6px;font-weight:900;box-sizing:border-box;filter:drop-shadow(0 2px 3px #24435a33)}.example{text-align:center;font-size:10px;color:#6c8293}.example small{display:block;margin-top:16px}.traffic-pin.closure{width:40px;height:40px;font-size:31px}a{color:#176faf}@media(max-width:360px){.grid{grid-template-columns:1fr}}</style>
<main><h1>通行止め・出入口閉鎖：警告エフェクト10案</h1><p>見本です。左が本線通行止め、右が出入口閉鎖。閉鎖を確認できた情報だけに効果を付けます。</p><div class="grid" id="grid"></div><p><a href="/">KPMAPへ戻る</a></p></main>
<script>const variants=[['outline','赤枠パルス'],['color','赤・黄の色変化'],['wave','外側へ波紋'],['dual','二重の波紋'],['corners','点線フレーム'],['breathe','×の呼吸'],['double','二拍パルス'],['sweep','光のスイープ'],['halo','赤い光の強弱'],['stripe','警告ストライプ']];document.getElementById('grid').innerHTML=variants.map(([cls,name],i)=>'<section class="card"><h2>'+(i+1)+'．'+name+'</h2><div class="scene">'+['本線','出入口'].map(label=>'<div class="example"><span class="traffic-pin closure effect-'+cls+'"><span class="closure-symbol">×</span></span><small>'+label+'</small></div>').join('')+'</div></section>').join('');</script></html>
