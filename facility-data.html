<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KPMAP 保有施設データ一覧</title>
<style>body{font:14px/1.6 system-ui;margin:0;padding:18px;color:#28465c;background:#f6f8fb}main{max-width:1100px;margin:auto}h1{font-size:21px}p{color:#61798b}select,input{font:inherit;padding:8px;border:1px solid #cbd7e1;border-radius:7px;background:white;max-width:100%;box-sizing:border-box}.filters{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}table{border-collapse:collapse;width:100%;background:white}th,td{text-align:left;padding:9px;border-bottom:1px solid #e0e7ed;vertical-align:top}th{color:#536d80;font-size:12px}td small{display:block;color:#647a8d}details{margin:8px 0}summary{cursor:pointer}.table-wrap{overflow-x:auto}a{color:#176faf}code{font-size:11px;overflow-wrap:anywhere}.note{padding:12px;border:1px solid #d6e0e8;border-radius:9px;background:white}</style>
<main><h1>名前・座標データの一覧</h1><p>対象4道路の保有データ。交通情報の位置推定に使う参照データで、公式施設台帳の完全な一覧ではありません。同名の別データや上下線の重複を含みます。</p><div class="note">中心座標・名称・出典を保有。TNには入口／出口・線形・上下線の候補もあります。方向の割当てや施設KP・正式延長は一部未確認です。橋も一部は道路線形・国交省由来の延長などを追加済みです。照合できなかった施設は推測で追加していません。現在の地図にあるIC・PA等135ラベルは別の表示用データも使っています。</div>
<div class="filters"><select id="road" aria-label="道路"><option value="">すべての道路</option><option>山陽道</option><option>中国道</option><option>広島道</option><option>広島岩国道路</option></select><select id="type" aria-label="施設種別"><option value="">すべての種類</option></select><input id="search" placeholder="施設名を検索" aria-label="施設名を検索"></div><p id="count" aria-live="polite">読込中…</p><div class="table-wrap"><table><thead><tr><th>道路・種類</th><th>名前</th><th>代表座標（緯度・経度）</th><th>詳細・出典</th></tr></thead><tbody id="rows"></tbody></table></div><p><a href="/facility-data.json">全データ（JSON）</a> ・ <a href="/">KPMAPへ戻る</a></p></main>
<script>
(async()=>{const data=await(await fetch('/facility-data.json')).json(),$=id=>document.getElementById(id);for(const t of [...new Set(data.rows.map(x=>x.type))].sort())$('type').add(new Option(t,t));const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function draw(){const rows=data.rows.filter(x=>(!$('road').value||x.road===$('road').value)&&(!$('type').value||x.type===$('type').value)&&x.name.includes($('search').value.trim()));$('count').textContent=rows.length+'行 / 全'+data.rows.length+'行 ・ データ作成 '+data.generatedAt;$('rows').innerHTML=rows.map(x=>'<tr><td>'+escape(x.road)+'<small>'+escape(x.type)+'</small></td><td>'+escape(x.name)+'</td><td>'+x.lat+'<br>'+x.lng+'</td><td>'+escape(x.source)+(x.structureDetails?.lengthM?'<small>資料上の橋長 '+escape(x.structureDetails.lengthM)+'m ・ 座標照合差 '+escape(x.structureDetails.matchingDistanceM)+'m</small>':'')+(x.path?.length?'<small>橋の線形 '+x.path.length+'点</small>':'')+(x.variants.length?'<details><summary>入口・出口・線形 '+x.variants.length+'候補</summary>'+x.variants.map(v=>'<div><b>'+escape(v.direction||'不明')+'（参考）</b><small>入口 '+escape(JSON.stringify(v.entry))+'<br>出口 '+escape(JSON.stringify(v.exit))+'<br>線形 '+(v.path?.length||0)+'点 ・ OSM '+escape((v.osmWays||[]).join(', '))+'</small></div>').join('')+'</details>':'')+'</td></tr>').join('')}$('road').onchange=$('type').onchange=$('search').oninput=draw;draw()})().catch(()=>document.getElementById('count').textContent='読み込みに失敗しました');
</script></html>
